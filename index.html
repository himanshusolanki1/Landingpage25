<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #ffffff;
  color: #171717;
}

body {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 14px;
}

main {
  width: min(100%, 430px);
  min-height: calc(100svh - 28px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: clamp(12px, 2vh, 18px);
}

/* ROUND LOGO */
.logo {
  width: clamp(110px, 24vh, 165px);
  height: clamp(110px, 24vh, 165px);
  border: 3px solid #e32636;
  border-radius: 50%;
  display: grid;
  place-items: center;
  padding: 0;
  overflow: hidden;
  flex-shrink: 0;
  background: #ffffff;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  border-radius: 50%;
}

.logo-fallback {
  font-size: 24px;
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -1px;
}

.logo-fallback span {
  color: #e32636;
}

/* HEADING */
h1 {
  font-size: clamp(27px, 6.5vw, 35px);
  font-weight: 800;
  letter-spacing: -1px;
  line-height: 1.15;
}

h1 span {
  color: #e32636;
}

.tagline {
  font-size: clamp(13px, 3.6vw, 15px);
  line-height: 1.5;
  color: #666666;
  max-width: 350px;
}

/* BENEFITS */
.offers {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 9px;
  text-align: left;
}

.offer {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 12px;
  border: 1px solid #eeeeee;
  border-radius: 13px;
  font-size: clamp(13px, 3.5vw, 15px);
  line-height: 1.35;
  background: #ffffff;
}

.check {
  width: 28px;
  height: 28px;
  flex: 0 0 28px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #fff0f1;
  color: #e32636;
  font-weight: 900;
  font-size: 17px;
}

/* TELEGRAM BUTTON */
.join {
  width: 100%;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 13px;
  background: #e32636;
  color: #ffffff;
  text-decoration: none;
  font-weight: 700;
  font-size: 16px;
  border-radius: 12px;
  transition: background 0.2s ease;
}

.join:hover {
  background: #c91d2d;
}

.join svg {
  width: 21px;
  height: 21px;
  flex-shrink: 0;
}

.note {
  font-size: 10px;
  color: #888888;
  line-height: 1.4;
}

/* SMALL MOBILE SCREENS */
@media (max-height: 700px) {
  main {
    gap: 9px;
  }

  .logo {
    width: 90px;
    height: 90px;
  }

  .offer {
    padding: 9px 10px;
  }

  .join {
    min-height: 44px;
  }
}

@media (max-width: 330px) {
  body {
    padding: 9px;
  }

  main {
    gap: 10px;
  }

  .offer {
    padding: 8px;
  }

  h1 {
    font-size: 25px;
  }
}
</style>
</head>

    Join Telegram

</main>
